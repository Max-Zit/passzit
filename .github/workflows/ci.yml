# All checks of a push in one workflow (so a quick series of pushes gives
# one result and at most one failure mail): build and tests with the
# browser crypto in Chrome, the Windows build, the security checks, the
# race detector and short fuzzing of the parsers of untrusted input.
# security.yml repeats the security checks weekly (new CVEs).
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test (Linux, browser crypto in Chrome)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l ./cmd ./internal ./tools)" || (gofmt -l ./cmd ./internal ./tools; exit 1)
      - name: Argon2id WebAssembly module
        run: go run ./tools/buildwasm
      - name: go vet
        run: go vet ./...
      # the PostgreSQL binaries of the tests: downloading them fails now and then
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.embedded-postgres-go
          # the PostgreSQL version of the tests, not go.sum: a new module must not
          # mean a new download
          key: embedded-postgres-18.3.0
          restore-keys: embedded-postgres-
      - name: Tests (the browser crypto and the extension run in Chrome)
        env:
          PASSZIT_BROWSER: google-chrome
        run: go test -count=1 -timeout 20m ./...
      - name: Build the extension (Chromium and Firefox)
        run: go run ./tools/extpack -version 0.0.0

  windows:
    name: Build (Windows)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build and vet for Windows
        env:
          GOOS: windows
        run: |
          go build ./...
          go vet ./...

  go:
    name: go
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks reads the whole history
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: build (Linux and Windows)
        run: |
          go build ./...
          GOOS=windows go build ./...
      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.8.2
          staticcheck ./...
          GOOS=windows staticcheck ./...
      - name: gosec
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.30.0
          gosec -quiet ./...
          GOOS=windows gosec -quiet ./...
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          govulncheck ./...
      - name: gitleaks (secrets in the history)
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          gitleaks git --redact --no-banner .

  race:
    name: Race detector (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Argon2id WebAssembly module
        run: go run ./tools/buildwasm
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.embedded-postgres-go
          key: embedded-postgres-18.3.0
          restore-keys: embedded-postgres-
      - name: Fetch the test PostgreSQL once (parallel test binaries would all download it)
        run: go test -race -count=1 -run '^TestSecretLinks$' ./internal/web
      - name: Tests with -race
        env:
          PASSZIT_BROWSER: google-chrome
        run: go test -race -count=1 -timeout 50m ./...

  fuzz:
    name: Fuzz parsers of untrusted input (short)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Argon2id WebAssembly module
        run: go run ./tools/buildwasm
      - name: Fuzz each target for 20 s
        run: |
          set -e
          # Every Fuzz* function in the tests, so new targets run without
          # touching this file.
          grep -rHo --include='*_test.go' '^func Fuzz[A-Za-z0-9_]*' internal cmd tools | sed 's/:func /:/' | sort -u |
          while IFS=: read -r file name; do
            echo "::group::$name ($(dirname "$file"))"
            go test "./$(dirname "$file")" -run '^$' -fuzz "^$name\$" -fuzztime 20s
            echo "::endgroup::"
          done
