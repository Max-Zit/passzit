# PassZit appliance: no root sign-in over SSH.
PermitRootLogin no
# Only strong ciphers and MACs: no chacha20-poly1305 (Terrapin, CVE-2023-48795)
# and no 64-bit UMAC tags.
Ciphers aes256-gcm@openssh.com,aes128-gcm@openssh.com,aes256-ctr,aes192-ctr,aes128-ctr
MACs hmac-sha2-512-etm@openssh.com,hmac-sha2-256-etm@openssh.com,umac-128-etm@openssh.com,hmac-sha2-512,hmac-sha2-256
# Hardening (Lynis SSH-7408): no forwarding through the appliance, fewer
# password tries per connection, key fingerprints in the log.
AllowTcpForwarding no
AllowAgentForwarding no
X11Forwarding no
MaxAuthTries 3
ClientAliveCountMax 2
LogLevel VERBOSE
